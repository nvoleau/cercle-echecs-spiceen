<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#1A1A1A" stroke="#C9922A" stroke-width="3"/>
  <!-- Knight chess piece simplified -->
  <g fill="#C9922A">
    <!-- Head -->
    <ellipse cx="50" cy="32" rx="10" ry="8"/>
    <!-- Snout/mouth area -->
    <ellipse cx="56" cy="36" rx="6" ry="4"/>
    <!-- Body -->
    <path d="M34 72 Q34 52 42 46 Q50 42 58 46 Q66 50 66 72 Z"/>
    <!-- Base -->
    <rect x="32" y="72" width="36" height="5" rx="2"/>
    <!-- Eye -->
    <circle cx="53" cy="30" r="2" fill="#1A1A1A"/>
  </g>
  <!-- CES initials -->
  <text x="50" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#C9922A" letter-spacing="2">CES</text>
</svg>
